name: Build Persona 5 Luma

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Persona 5 x64 Release
      run: |
        msbuild Luma.sln /p:Configuration="Publishing-Release" /p:Platform="x64" /p:DefineConstants="REMOTE_BUILD=1"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Luma-Persona_5
        path: |
          bin/x64/Publishing-Release/Persona 5.addon64
          bin/x64/Publishing-Release/Persona 5/
          Output/
          **/*.addon64
        if-no-files-found: warn
